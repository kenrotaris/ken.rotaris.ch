- role: Salsa & Bachata Event Aggregator
  company: Ritmo
  companyDescription: Crawls dance-event sites across Switzerland into one deduplicated feed.
  logo: /images/projects/ritmo.svg
  location: Freetime
  dates:
    from: Apr 2026
    to: Aug 2026
  summary: Event crawler for salsa, bachata, kizomba and zouk socials. An LLM authors a scraper per site once; the recurring crawl then runs deterministically and merges every source into a single normalized, deduplicated feed.
  showcasedSkills:
  - Python
  - LLM Agents
  - Playwright
  - PostgreSQL
  - Web Scraping
  accomplishments:
  - Built a two-speed design where an LLM authors and repairs per-site extractors at setup time, while the daily crawl stays fully deterministic and LLM-free, keeping recurring runs free of API spend and non-determinism.
  - Added an agentic authoring path where the model drives a real browser through a tool surface (navigate, query, screenshot) and must verify its own selectors against the live DOM before submitting them.
  - Probed cheaper sources first (iCal feeds, then schema.org structured data) so most sites onboard without any model call at all.
  - Normalized and deduplicated events across overlapping sites using fuzzy matching and source-tier priority, keeping a current snapshot in Postgres.
  - 'Made the crawler self-repairing: when a layout change breaks selectors, the site is re-snapshotted and the extractor re-authored, and only promoted if it beats the previous baseline.'
  - Recovered fields that exist only inside flyer images by OCR-ing them locally with Tesseract, keeping the crawl path deterministic.
  categories:
    label: Technologies
    Crawling:
    - Playwright
    - crawl4ai
    - BeautifulSoup
    - Trafilatura
    - extruct
    - Tesseract OCR
    AI:
    - LLM Extractor Authoring
    - Agentic Tool Use
    - Prompt Engineering
    Backend:
    - Python 3.12
    - Pydantic
    - SQLModel
    - Alembic
    - PostgreSQL
    - Typer
    Pipeline:
    - Normalization
    - Fuzzy Deduplication
    - RapidFuzz
    - dateparser
    - iCal
